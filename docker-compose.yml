services:
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.app
    command: --host 0.0.0.0 --port 42110
    ports:
      - "${FASTAPI_PORT:-42110}:${FASTAPI_PORT:-42110}"
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    depends_on:
      - redis
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.app
    entrypoint: ["/app/scripts/tts_celery-entrypoint.sh"]
    command: worker --loglevel=${CELERY_LOGLEVEL:-info} --pool=${CELERY_POOL:-solo}
    environment:
      - C_FORCE_ROOT=true  # Use with caution, enables root user in Celery.
      - CELERY_BROKER_URL=redis://redis:${REDIS_PORT}/0
      - CELERY_RESULT_BACKEND=redis://redis:${REDIS_PORT}/0
      - CELERY_CONCURRENCY=${CELERY_CONCURRENCY}
    env_file:
      - .env
    depends_on:
      - redis
      - fastapi
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  redis:
    image: "redis:alpine"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    env_file:
      - .env
      
networks:
  default:
    driver: bridge
